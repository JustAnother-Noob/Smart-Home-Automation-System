<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Smart Living Tech</title>
  <link rel="icon" type="image/x-icon" href="assets/logo.ico">

  <style>
    /* Prevent layout shift during loading */
    * { box-sizing: border-box; }
    body { 
      margin: 0; 
      padding: 0; 
      font-family: 'Inter', sans-serif; 
      background-color: #ffffff;
      overflow-x: hidden;
    }
    html { scroll-behavior: smooth; }
    #navbar { 
      min-height: 85px; 
      position: sticky;
      top: 0;
      z-index: 1000;
      background: white;
    }
    main { 
      opacity: 0; 
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    main.loaded { 
      opacity: 1; 
      visibility: visible;
    }
    /* Prevent container blinking/flashing */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
      box-sizing: border-box;
    }
    .login-container, .form-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
      box-sizing: border-box;
    }
    /* Hide banners initially to prevent blinking - show them last */
    .shipping-banner, .promo-banner, .info-banner, .info-banner-small {
      box-sizing: border-box;
      width: 100%;
      position: relative;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    .info-banner-icon, .info-banner-content, .info-banner-actions {
      box-sizing: border-box;
      position: relative;
    }
    /* Show banners after everything else is loaded */
    .banners-loaded .shipping-banner,
    .banners-loaded .promo-banner,
    .banners-loaded .info-banner,
    .banners-loaded .info-banner-small {
      opacity: 1;
      visibility: visible;
    }
    /* Prevent breadcrumb blinking */
    #breadcrumb-root, .breadcrumb, .breadcrumb-nav {
      box-sizing: border-box;
      width: 100%;
      position: relative;
      min-height: 24px;
      margin: 0;
      padding: 8px 0;
    }
    /* Prevent content flash */
    .login-container, .form-container, .login-form {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    body.loaded .login-container,
    body.loaded .form-container,
    body.loaded .login-form {
      opacity: 1;
      transform: translateY(0);
    }
  </style>

     <link rel="stylesheet" href="css/global.css">

  <link rel="stylesheet" href="css/layout/user_navbar.css">
  <link rel="stylesheet" href="css/pages/user_login.css">
  <link rel="stylesheet" href="css/layout/user_footer.css">

  <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/3.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>

  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <script src="js/loadNav.js"></script>
</head>
<body>

  <div id="navbar"></div>

  <div class="login-top-image" aria-hidden="true">
    <img src="assets/images/signup_voucher.png" alt="Login voucher" />
  </div>

  <div class="form-container">
    <h1>Welcome Back</h1>
    
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <div id="emailError" class="error-message"></div>
      </div>
      
      <div class="form-group">
        <label for="password">Password:</label>
        <div class="password-container">
          <input type="password" id="password" name="password" required>
          <i id="show-pwd" class="fi fi-rr-eye-crossed password-toggle" aria-label="Toggle password visibility"></i>
        </div>
        <div id="passwordError" class="error-message"></div>
      </div>
      
      <div class="remember-forgot">
        <div class="remember-me">
          <input type="checkbox" id="rememberMe" name="rememberMe">
          <label for="rememberMe">Remember me</label>
        </div>
        <a href="user_change_password.html" class="forgot-link">Forgot Password?</a>
      </div>
      
      <div class="g-recaptcha" id="recaptchaContainer"
        data-sitekey="6LdHU_0qAAAAAPeJGSJhhVigGOoMTRv5peDU9uG4"
        data-callback="recaptchaSuccess"
        data-expired-callback="recaptchaExpired"
        data-error-callback="recaptchaError">
      </div>
      <div id="recaptchaError" class="error-message"></div>
      
      <div id="statusMessage" class="status-message" style="display: none;" role="status" aria-live="polite">
        <span class="status-text"></span>
      </div>
      
      <button type="submit" class="btn-primary">Sign In</button>
      
      <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <p>Signing you in...</p>
      </div>
    </form>
    
    <div class="divider">
      <span>OR</span>
    </div>
    
    <div class="google-signin-container">
      <div id="googleSignInButton"></div>
    </div>
    
    <div class="signup-link">
      Don't have an account? <a href="user_signup.html">Sign up</a>
    </div>
  </div>

  <div id="footer"></div>

  <script>
    // Environment configuration
    const CONFIG = {
      API_URL: window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
        ? 'http://127.0.0.1:5002/api' 
        : '/api',
      GOOGLE_CLIENT_ID: "1028485501245-c9kh3ga5umg7jhn9bvticpaf10iputqg.apps.googleusercontent.com"
    };

    // FIXED: Make CONFIG globally available for user_login.js
    window.CONFIG = CONFIG;
  </script>

  <script>
    // Handle reCAPTCHA callbacks
    window.recaptchaSuccess = function(token) {
      const isDevelopment = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      if (!isDevelopment) {
        window.recaptchaToken = token;
        const el = document.getElementById('recaptchaError');
        if (el) el.textContent = '';
      }
    };

    window.recaptchaExpired = function() {
      const isDevelopment = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      if (!isDevelopment) {
        window.recaptchaToken = null;
        const el = document.getElementById('recaptchaError');
        if (el) el.textContent = 'reCAPTCHA expired. Please verify again.';
      }
    };

    window.recaptchaError = function() {
      const isDevelopment = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      if (!isDevelopment) {
        window.recaptchaToken = null;
        const el = document.getElementById('recaptchaError');
        if (el) el.textContent = 'reCAPTCHA error. Please try again.';
      }
    };

    // Google Sign-In Initialization with retry and fallback
    function initializeGoogleSignIn() {
      if (typeof google !== 'undefined' && google.accounts) {
        try {
          google.accounts.id.initialize({
            client_id: CONFIG.GOOGLE_CLIENT_ID,
            callback: handleGoogleSignIn,
            auto_select: false,
            cancel_on_tap_outside: true
          });

          const buttonDiv = document.getElementById('googleSignInButton');
          if (buttonDiv) {
            google.accounts.id.renderButton(buttonDiv, {
              theme: 'outline',
              size: 'large',
              width: '100%',
              text: 'signin_with'
            });
            console.log('✅ Google Sign-In initialized successfully');
          } else {
            console.warn('❌ Google Sign-In button container not found');
          }
        } catch (error) {
          console.error('❌ Google Sign-In initialization failed:', error);
          showGoogleSignInFallback();
        }
      } else {
        console.warn('❌ Google Sign-In API not available, retrying...');
        if (!window.googleInitRetries) window.googleInitRetries = 0;
        if (window.googleInitRetries < 5) {
          window.googleInitRetries++;
          setTimeout(initializeGoogleSignIn, 1000);
        } else {
          console.error('❌ Google Sign-In API failed to load after 5 attempts');
          showGoogleSignInFallback();
        }
      }
    }

    function showGoogleSignInFallback() {
      const buttonDiv = document.getElementById('googleSignInButton');
      if (buttonDiv) {
        buttonDiv.innerHTML = `
          <button class="google-signin-fallback" onclick="handleGoogleSignInFallback()">
            <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" style="margin-right: 8px; vertical-align: middle;">
              <g fill="#000" fill-rule="evenodd">
                <path d="M9 3.48c1.69 0 2.83.73 3.48 1.34l2.54-2.48C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.96l2.91 2.26C4.6 5.05 6.62 3.48 9 3.48z" fill="#EA4335"/>
                <path d="M17.64 9.2c0-.74-.06-1.28-.19-1.84H9v3.34h4.96c-.1.83-.64 2.08-1.84 2.82l2.84 2.2c1.7-1.57 2.68-3.88 2.68-6.52z" fill="#4285F4"/>
                <path d="M3.88 10.78A5.54 5.54 0 0 1 3.58 9c0-.62.11-1.22.29-1.78L.96 4.96A9.008 9.008 0 0 0 0 9c0 1.45.35 2.82.96 4.04l2.92-2.26z" fill="#FBBC05"/>
                <path d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.84-2.2c-.76.53-1.78.9-3.12.9-2.38 0-4.4-1.57-5.12-3.74L.96 13.04C2.44 15.98 5.48 18 9 18z" fill="#34A853"/>
              </g>
            </svg>
            Sign in with Google
          </button>`;
        console.log('📄 Google Sign-In fallback button displayed');
      }
    }

    function handleGoogleSignInFallback() {
      alert('Google Sign-In is temporarily unavailable. Please use email/password login or try again later.');
    }

    function handleGoogleSignIn(response) {
      console.log('🔵 Google Sign-In initiated for login');
      if (typeof sendGoogleTokenToBackend === 'function') {
        sendGoogleTokenToBackend(response.credential);
      } else {
        console.error('❌ sendGoogleTokenToBackend function not found');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      console.log('🔄 DOM loaded, initializing Google Sign-In...');
      
      // Hide reCAPTCHA in development mode
      const isDevelopment = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      if (isDevelopment) {
        const recaptchaContainer = document.getElementById('recaptchaContainer');
        const recaptchaError = document.getElementById('recaptchaError');
        if (recaptchaContainer) {
          recaptchaContainer.style.display = 'none';
        }
        if (recaptchaError) {
          recaptchaError.style.display = 'none';
        }
        console.log('⚠️ reCAPTCHA hidden in development mode');
      }
      
      initializeGoogleSignIn();
    });

    window.addEventListener('load', () => {
      console.log('🔄 Window loaded, checking Google Sign-In...');
      if (!document.querySelector('#googleSignInButton iframe')) {
        initializeGoogleSignIn();
      }
    });
  </script>
  <script src="js/user/user_login.js" defer></script>

  <script>
    // Prevent FOUC by ensuring content loads smoothly
    document.addEventListener('DOMContentLoaded', function() {
      // Wait for navbar and breadcrumbs to be loaded first
      const checkComponents = setInterval(() => {
        const navbar = document.getElementById('navbar');
        const breadcrumb = document.getElementById('breadcrumb-root');
        
        // Check if navbar is loaded (required)
        const navbarLoaded = navbar && navbar.children.length > 0;
        
        // Check if breadcrumb is loaded (optional - some pages don't have breadcrumbs)
        const breadcrumbLoaded = !breadcrumb || breadcrumb.children.length > 0;
        
        if (navbarLoaded && breadcrumbLoaded) {
          clearInterval(checkComponents);
          
          // Then show main content
          setTimeout(() => {
            document.body.classList.add('loaded');
            // Remove the loading overlay if it exists
            const overlay = document.getElementById('nav-loading-overlay');
            if (overlay) {
              overlay.style.opacity = '0';
              setTimeout(() => overlay.remove(), 300);
            }
            
            // Show banners LAST after everything else is loaded
            setTimeout(() => {
              document.body.classList.add('banners-loaded');
            }, 300);
          }, 200);
        }
      }, 50);
      
      // Fallback: show content after max 2 seconds
      setTimeout(() => {
        if (!document.body.classList.contains('loaded')) {
          document.body.classList.add('loaded');
        }
        // Show banners in fallback too
        if (!document.body.classList.contains('banners-loaded')) {
          document.body.classList.add('banners-loaded');
        }
      }, 2000);
    });
  </script>
</body>
</html>
