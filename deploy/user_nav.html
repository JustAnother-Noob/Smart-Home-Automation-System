  <script>
  (function(){
    const API = (window.CONFIG && CONFIG.API_URL ? CONFIG.API_URL : '/api').replace(/\/$/, '');

    async function refresh(){
      const desk = document.getElementById('cart-count');
      const mobile = document.getElementById('mobile-cart-count');
      try {
        // Prefer modern CartClient if available
        if (window.CartClient && typeof window.CartClient.getCart === 'function') {
          const data = await window.CartClient.getCart();
          const cart = data && data.cart ? data.cart : data;
          let count = 0;
          if (cart) {
            if (typeof cart.totalItems === 'number') count = cart.totalItems;
            else if (typeof cart.totalQuantity === 'number') count = cart.totalQuantity;
            else if (Array.isArray(cart.items)) count = cart.items.reduce((s,i)=>s+(Number(i.quantity)||0),0);
          }
          if (desk) desk.textContent = count;
          if (mobile) mobile.textContent = count;
          return;
        }

        const sessionId = localStorage.getItem('cartSessionId');
        if (!sessionId) return;
        const res = await fetch(`${API}/cart`, { headers: { 'x-session-id': sessionId }});
        const data = await res.json();
        const count = (data.cart?.items||[]).reduce((s,i)=>s+(Number(i.quantity)||0),0);
        if (desk) desk.textContent = count;
        if (mobile) mobile.textContent = count;
      } catch (e) {
      }
    }

    document.addEventListener('cart:updated', () => refresh());
    document.addEventListener('DOMContentLoaded', () => refresh());
  })();
  </script>
